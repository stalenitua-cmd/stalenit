<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<meta name="theme-color" content="#0a0e1a">
<title>Калькулятор металу — Сталеніт</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --bg:#0a0e1a;
  --surface:#111826;
  --surface2:#161e30;
  --border:#232d42;
  --accent:#1a467f;
  --accent2:#2c5d9e;
  --gold:#c8a96e;
  --gold2:#e0c68f;
  --text:#f2f4f8;
  --text2:#aab3c5;
  --muted:#6b7690;
  --danger:#e0665e;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--bg);color:var(--text);
  font-family:'Inter',sans-serif;font-size:14px;
  min-height:100vh;overflow-x:hidden;
}
h1,h2,h3,.disp{font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:.01em}

/* HEADER */
header{
  background:var(--surface);border-bottom:1px solid var(--border);
  padding:14px 20px;display:flex;align-items:center;gap:12px;
  position:sticky;top:0;z-index:50;
}
.logo-mark{
  width:36px;height:36px;border-radius:9px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:19px;color:var(--gold2);
}
.htext{line-height:1.2}
.htext .t1{font-family:'Barlow Condensed',sans-serif;font-size:19px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.htext .t2{font-size:10.5px;color:var(--gold);text-transform:uppercase;letter-spacing:.1em;margin-top:1px}

/* LAYOUT */
.wrap{display:flex;min-height:calc(100vh - 65px)}
.sidebar{
  width:230px;flex-shrink:0;background:var(--surface);
  border-right:1px solid var(--border);padding:18px 14px;
  display:flex;flex-direction:column;gap:20px;
}
.sec-label{
  font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);
  font-weight:700;margin-bottom:9px;padding:0 4px;
}
.chip-list{display:flex;flex-direction:column;gap:3px}
.chip{
  background:transparent;border:none;color:var(--text2);
  padding:9px 12px;border-radius:8px;text-align:left;
  font-size:13.5px;font-family:inherit;cursor:pointer;
  transition:all .15s;display:flex;align-items:center;justify-content:space-between;
}
.chip:hover{background:var(--surface2);color:var(--text)}
.chip.active{background:var(--accent);color:#fff;font-weight:600}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--gold);opacity:0;transition:opacity .15s}
.chip.active .dot{opacity:1}

.main{flex:1;padding:26px 30px 100px;max-width:760px}
.profile-title{font-size:26px;margin-bottom:3px}
.profile-sub{font-size:12.5px;color:var(--muted);margin-bottom:22px}
.approx-note{
  display:inline-flex;align-items:center;gap:6px;background:rgba(200,169,110,.1);
  border:1px solid rgba(200,169,110,.3);color:var(--gold);
  font-size:11.5px;padding:5px 11px;border-radius:7px;margin-bottom:18px;
}

.diagram-wrap{
  background:var(--surface);border:1px solid var(--border);border-radius:14px;
  padding:20px;margin-bottom:22px;display:flex;align-items:center;justify-content:center;
  min-height:180px;
}
.diagram-wrap svg{max-width:100%;height:auto}

.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px;margin-bottom:8px}
.field{display:flex;flex-direction:column;gap:6px}
.field.full{grid-column:1/-1}
.field label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.field .input-row{position:relative}
.field input{
  width:100%;background:var(--surface2);border:1px solid var(--border);
  border-radius:9px;padding:11px 40px 11px 13px;font-size:15px;color:var(--text);
  font-family:inherit;outline:none;transition:border-color .15s;
}
.field input:focus{border-color:var(--accent2)}
.field .unit{
  position:absolute;right:13px;top:50%;transform:translateY(-50%);
  font-size:12px;color:var(--muted);pointer-events:none;
}

/* RESULT BAR */
.result-bar{
  position:fixed;bottom:0;left:230px;right:0;
  background:var(--surface);border-top:1px solid var(--border);
  padding:16px 30px;display:flex;align-items:center;justify-content:space-between;
  z-index:40;
}
.result-label{font-size:11.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600}
.result-value{
  font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:38px;color:var(--gold2);
  line-height:1;display:flex;align-items:baseline;gap:8px;
}
.result-value .unit{font-size:16px;color:var(--gold);font-weight:600;font-family:'Inter',sans-serif}
.result-meta{font-size:11.5px;color:var(--muted);margin-top:3px}

/* MOBILE */
.mobile-tabs{display:none}
@media(max-width:860px){
  .sidebar{display:none}
  .mobile-tabs{
    display:flex;gap:8px;overflow-x:auto;padding:12px 16px;
    background:var(--surface);border-bottom:1px solid var(--border);
    -webkit-overflow-scrolling:touch;
  }
  .mobile-tabs::-webkit-scrollbar{display:none}
  .mtab{
    flex-shrink:0;background:var(--surface2);border:1px solid var(--border);color:var(--text2);
    padding:8px 14px;border-radius:20px;font-size:12.5px;font-family:inherit;cursor:pointer;white-space:nowrap;
  }
  .mtab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  .main{padding:20px 16px 110px;max-width:100%}
  .form-grid{grid-template-columns:1fr 1fr}
  .result-bar{left:0;padding:14px 16px}
  .result-value{font-size:30px}
}
@media(max-width:420px){
  .form-grid{grid-template-columns:1fr}
}

.footer-tip{font-size:11px;color:var(--muted);margin-top:22px;line-height:1.6}
</style>
</head>
<body>

<header>
  <div class="logo-mark">С</div>
  <div class="htext">
    <div class="t1">Сталеніт</div>
    <div class="t2">Калькулятор ваги металу</div>
  </div>
</header>

<div class="mobile-tabs" id="mMaterialTabs"></div>
<div class="mobile-tabs" id="mProfileTabs" style="border-top:1px solid var(--border)"></div>

<div class="wrap">
  <aside class="sidebar">
    <div>
      <div class="sec-label">Матеріал</div>
      <div class="chip-list" id="materialList"></div>
    </div>
    <div>
      <div class="sec-label">Прокат</div>
      <div class="chip-list" id="profileList"></div>
    </div>
  </aside>

  <main class="main">
    <div class="profile-title" id="profileTitle">Труба</div>
    <div class="profile-sub" id="profileSub">Вкажіть розміри для розрахунку ваги</div>
    <div id="approxNoteWrap"></div>

    <div class="diagram-wrap" id="diagramWrap"></div>

    <div class="form-grid" id="formGrid"></div>

    <div class="footer-tip">Розрахунок орієнтовний, за стандартними довідковими густинами металів. Для точних замовлень уточнюйте вагу у менеджера.</div>
  </main>
</div>

<div class="result-bar">
  <div>
    <div class="result-label">Загальна вага</div>
    <div class="result-meta" id="resultMeta">—</div>
  </div>
  <div class="result-value"><span id="resultVal">0</span><span class="unit">кг</span></div>
</div>

<script>
/* ═══ DATA ═══ */
const MATERIALS = [
  {key:'steel_black', name:'Сталь чорна', density:7850},
  {key:'steel_stainless', name:'Нержавіюча сталь', density:7900},
  {key:'titanium', name:'Титан', density:4500},
  {key:'nichrome', name:'Ніхром', density:8400},
  {key:'copper', name:'Мідь', density:8900},
  {key:'aluminum', name:'Алюміній', density:2700},
  {key:'cast_iron', name:'Чавун', density:7200},
  {key:'brass', name:'Латунь', density:8500},
  {key:'bronze', name:'Бронза', density:8700},
];

const PROFILES = [
  {key:'pipe', name:'Труба'},
  {key:'square', name:'Квадрат'},
  {key:'round', name:'Круг / Пруток'},
  {key:'angle', name:'Кутник'},
  {key:'sheet', name:'Лист'},
  {key:'strip', name:'Смуга'},
  {key:'profile_pipe', name:'Труба профільна'},
  {key:'hex', name:'Шестигранник'},
  {key:'channel', name:'Швелер'},
  {key:'beam', name:'Балка'},
];

/* field defs per profile: [key, label, unit] */
const FIELDS = {
  pipe:         [['d','Зовнішній діаметр','мм'],['wall','Товщина стінки','мм'],['len','Довжина','м']],
  square:       [['side','Сторона','мм'],['len','Довжина','м']],
  round:        [['d','Діаметр','мм'],['len','Довжина','м']],
  angle:        [['a','Полиця A','мм'],['b','Полиця B','мм'],['t','Товщина','мм'],['len','Довжина','м']],
  sheet:        [['w','Ширина','мм'],['t','Товщина','мм'],['len','Довжина','м']],
  strip:        [['w','Ширина','мм'],['t','Товщина','мм'],['len','Довжина','м']],
  profile_pipe: [['a','Сторона A','мм'],['b','Сторона B','мм'],['wall','Товщина стінки','мм'],['len','Довжина','м']],
  hex:          [['s','Розмір "під ключ"','мм'],['len','Довжина','м']],
  channel:      [['h','Висота','мм'],['b','Ширина полиці','мм'],['s','Товщина стінки','мм'],['t','Товщина полиці','мм'],['len','Довжина','м']],
  beam:         [['h','Висота','мм'],['b','Ширина полиці','мм'],['s','Товщина стінки','мм'],['t','Товщина полиці','мм'],['len','Довжина','м']],
};

const APPROX = new Set(['channel','beam']);

/* area(mm²) calculators — return null if invalid */
function calcArea(profile, v){
  const n = k => parseFloat(v[k]);
  switch(profile){
    case 'pipe': {
      const D=n('d'), w=n('wall');
      if(!D||!w||w*2>=D) return null;
      const d = D - 2*w;
      return Math.PI/4*(D*D - d*d);
    }
    case 'square': {
      const a=n('side'); if(!a) return null;
      return a*a;
    }
    case 'round': {
      const d=n('d'); if(!d) return null;
      return Math.PI/4*d*d;
    }
    case 'angle': {
      const a=n('a'), b=n('b'), t=n('t');
      if(!a||!b||!t) return null;
      return t*(a+b-t);
    }
    case 'sheet':
    case 'strip': {
      const w=n('w'), t=n('t');
      if(!w||!t) return null;
      return w*t;
    }
    case 'profile_pipe': {
      const a=n('a'), b=n('b'), w=n('wall');
      if(!a||!b||!w) return null;
      const a2=Math.max(0,a-2*w), b2=Math.max(0,b-2*w);
      return a*b - a2*b2;
    }
    case 'hex': {
      const s=n('s'); if(!s) return null;
      return (Math.sqrt(3)/2)*s*s;
    }
    case 'channel': {
      const h=n('h'), b=n('b'), s=n('s'), t=n('t');
      if(!h||!b||!s||!t) return null;
      return s*h + 2*t*(b-s);
    }
    case 'beam': {
      const h=n('h'), b=n('b'), s=n('s'), t=n('t');
      if(!h||!b||!s||!t) return null;
      return s*(h-2*t) + 2*b*t;
    }
  }
  return null;
}

/* ═══ SVG DIAGRAMS (simple, brand-colored) ═══ */
const STROKE = '#2c5d9e';
const FILL = 'rgba(26,70,127,.35)';
const GOLD = '#c8a96e';

function svgWrap(inner, vb='0 0 220 180'){
  return `<svg viewBox="${vb}" width="220" height="180" fill="none">${inner}</svg>`;
}
function dimLine(x1,y1,x2,y2,label,offset=0){
  return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${GOLD}" stroke-width="1"/>
    <text x="${(x1+x2)/2}" y="${(y1+y2)/2 - 6 + offset}" fill="${GOLD}" font-size="10" text-anchor="middle" font-family="Inter">${label}</text>`;
}

const DIAGRAMS = {
  pipe: svgWrap(`
    <circle cx="110" cy="90" r="62" stroke="${STROKE}" stroke-width="14" fill="${FILL}"/>
    ${dimLine(48,90,172,20,'D')}
  `),
  square: svgWrap(`
    <rect x="55" y="35" width="110" height="110" stroke="${STROKE}" stroke-width="3" fill="${FILL}"/>
    ${dimLine(55,35,165,35,'a')}
  `),
  round: svgWrap(`
    <circle cx="110" cy="90" r="55" stroke="${STROKE}" stroke-width="3" fill="${FILL}"/>
    ${dimLine(55,90,165,90,'D')}
  `),
  angle: svgWrap(`
    <path d="M50 40 L50 150 L160 150 L160 120 L80 120 L80 40 Z" stroke="${STROKE}" stroke-width="3" fill="${FILL}"/>
    ${dimLine(50,40,50,150,'A',60)}
  `),
  sheet: svgWrap(`
    <rect x="40" y="55" width="140" height="70" stroke="${STROKE}" stroke-width="3" fill="${FILL}"/>
    ${dimLine(40,55,180,55,'ширина')}
  `),
  strip: svgWrap(`
    <rect x="30" y="75" width="160" height="28" stroke="${STROKE}" stroke-width="3" fill="${FILL}"/>
    ${dimLine(30,75,190,75,'ширина')}
  `),
  profile_pipe: svgWrap(`
    <rect x="45" y="40" width="130" height="100" rx="6" stroke="${STROKE}" stroke-width="14" fill="${FILL}"/>
    ${dimLine(45,40,175,40,'A')}
  `),
  hex: svgWrap(`
    <polygon points="110,30 165,60 165,120 110,150 55,120 55,60" stroke="${STROKE}" stroke-width="3" fill="${FILL}"/>
    ${dimLine(55,90,165,90,'S')}
  `),
  channel: svgWrap(`
    <path d="M55 30 L55 150 L85 150 L85 60 L150 60 L150 30 Z" stroke="${STROKE}" stroke-width="3" fill="${FILL}"/>
    ${dimLine(55,30,55,150,'h',60)}
  `),
  beam: svgWrap(`
    <path d="M50 30 L170 30 L170 55 L120 55 L120 125 L170 125 L170 150 L50 150 L50 125 L100 125 L100 55 L50 55 Z" stroke="${STROKE}" stroke-width="3" fill="${FILL}"/>
    ${dimLine(50,30,50,150,'h',60)}
  `),
};

/* ═══ STATE ═══ */
let curMaterial = 'steel_black';
let curProfile = 'pipe';

/* ═══ RENDER ═══ */
function renderMaterialList(){
  const list = document.getElementById('materialList');
  list.innerHTML = MATERIALS.map(m => `
    <button class="chip${m.key===curMaterial?' active':''}" onclick="setMaterial('${m.key}')">
      <span>${m.name}</span><span class="dot"></span>
    </button>`).join('');

  const mtabs = document.getElementById('mMaterialTabs');
  mtabs.innerHTML = MATERIALS.map(m => `
    <button class="mtab${m.key===curMaterial?' active':''}" onclick="setMaterial('${m.key}')">${m.name}</button>`).join('');
}

function renderProfileList(){
  const list = document.getElementById('profileList');
  list.innerHTML = PROFILES.map(p => `
    <button class="chip${p.key===curProfile?' active':''}" onclick="setProfile('${p.key}')">
      <span>${p.name}</span><span class="dot"></span>
    </button>`).join('');

  const mtabs = document.getElementById('mProfileTabs');
  mtabs.innerHTML = PROFILES.map(p => `
    <button class="mtab${p.key===curProfile?' active':''}" onclick="setProfile('${p.key}')">${p.name}</button>`).join('');
}

function renderForm(){
  const p = PROFILES.find(x=>x.key===curProfile);
  document.getElementById('profileTitle').textContent = p.name;
  document.getElementById('diagramWrap').innerHTML = DIAGRAMS[curProfile];

  const approxWrap = document.getElementById('approxNoteWrap');
  approxWrap.innerHTML = APPROX.has(curProfile)
    ? `<div class="approx-note">&#9888; Наближений розрахунок — для точних замовлень звіряйте з ГОСТ-таблицею профілю</div>`
    : '';

  const grid = document.getElementById('formGrid');
  grid.innerHTML = FIELDS[curProfile].map(([key,label,unit]) => `
    <div class="field">
      <label>${label}</label>
      <div class="input-row">
        <input type="number" inputmode="decimal" min="0" step="any" id="f_${key}" oninput="calculate()" placeholder="0">
        <span class="unit">${unit}</span>
      </div>
    </div>`).join('');
}

function setMaterial(key){
  curMaterial = key;
  renderMaterialList();
  calculate();
}
function setProfile(key){
  curProfile = key;
  renderProfileList();
  renderForm();
  calculate();
}

function calculate(){
  const values = {};
  FIELDS[curProfile].forEach(([key]) => {
    const el = document.getElementById('f_'+key);
    values[key] = el ? el.value : '';
  });
  const area = calcArea(curProfile, values);
  const mat = MATERIALS.find(m=>m.key===curMaterial);
  const resultEl = document.getElementById('resultVal');
  const metaEl = document.getElementById('resultMeta');

  if(area === null || area <= 0){
    resultEl.textContent = '0';
    metaEl.textContent = 'Заповніть розміри';
    return;
  }
  const len = parseFloat(values.len) || 0;
  if(FIELDS[curProfile].some(f=>f[0]==='len') && len<=0){
    resultEl.textContent = '0';
    metaEl.textContent = 'Вкажіть довжину';
    return;
  }

  // volume(m3) = area(mm2) * 1e-6 * length(m)
  const lenM = FIELDS[curProfile].some(f=>f[0]==='len') ? len : 1;
  const volume = area * 1e-6 * lenM;
  const weight = volume * mat.density;

  resultEl.textContent = weight >= 100 ? weight.toFixed(1) : weight.toFixed(3);
  metaEl.textContent = `${mat.name} · густина ${mat.density} кг/м³`;
}

/* ═══ INIT ═══ */
renderMaterialList();
renderProfileList();
renderForm();
calculate();

/* PWA service worker */
if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
</body>
</html>
