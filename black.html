<script>
/* ============================================================
   GOOGLE SHEETS ПІДКЛЮЧЕННЯ
   ID таблиці — змінювати тут якщо таблиця зміниться
   ============================================================ */
const SHEET_ID = '1jqWOwfwcIVoP9-gpp0uuJeNMgYbpZlTbiF9BsTFurUc';

/* Метадані категорій — назви, фото, фільтри */
const CAT_META = {
  pipe:    { name:'Труба безшовна',  img:'pipe.jpg',     cnt:'160+', filterCol:{diam:0,wall:1,grade:2} },
  round:   { name:'Круг металевий',  img:'round.jpg',    cnt:'400+', filterCol:{diam:0,grade:1} },
  sheet:   { name:'Лист сталевий',   img:'sheet.jpg',    cnt:'85+',  filterCol:{thick:0,grade:1} },
  profile: { name:'Труба профільна', img:'profile.jpg',  cnt:'130+', filterCol:{} },
  weld:    { name:'Труба зварна',    img:'pipe.jpg',     cnt:'12',   filterCol:{diam:0,wall:1} },
  angle:   { name:'Кутник',          img:'angle.jpg',    cnt:'65+',  filterCol:{shelf:0} },
  beam:    { name:'Балка / Двотавр', img:'beam.jpg',     cnt:'16',   filterCol:{} },
  channel: { name:'Швелер',          img:'channel.jpg',  cnt:'10',   filterCol:{} },
  rebar:   { name:'Арматура',        img:'rebar.jpg',    cnt:'12',   filterCol:{diam:0,grade:1} },
  hex:     { name:'Шестигранник',    img:'hex.jpg',      cnt:'90+',  filterCol:{diam:0,grade:1} },
  square:  { name:'Квадрат',         img:'square.jpg',   cnt:'50+',  filterCol:{diam:0,grade:1} },
  strip:   { name:'Смуга',           img:'strip.jpg',    cnt:'60+',  filterCol:{grade:1} },
};

/* Кеш даних з таблиці */
const SHEETS_CACHE = {};
let sheetsLoading = false;

/* Завантажити аркуш з Google Sheets */
async function fetchSheet(sheetName) {
  if (SHEETS_CACHE[sheetName]) return SHEETS_CACHE[sheetName];

  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${sheetName}`;
  try {
    const res = await fetch(url);
    const text = await res.text();
    // Google повертає JSONP — прибираємо обгортку
    const json = JSON.parse(text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\)/)[1]);
    const rows = json.table.rows || [];
    // Пропускаємо рядок заголовка (row 0 = заголовки колонок)
    const data = rows.slice(1).map(r => r.c.map(c => c ? (c.v !== null && c.v !== undefined ? String(c.v) : '') : '')).filter(r => r[0] && r[0].trim());
    SHEETS_CACHE[sheetName] = data;
    return data;
  } catch(e) {
    console.error('Помилка завантаження аркуша', sheetName, e);
    return [];
  }
}

/* ============================================================
   СТАН
   ============================================================ */
let activeCat = 'pipe';
let filters = { diam:'', shelf:'', thick:'', wall:'', grade:'' };
let page = 1;
const PER = 25;
let currentRows = []; // рядки поточної категорії з таблиці
let currentCols = []; // заголовки колонок

/* Завантажити і показати категорію */
async function loadCategory(catKey) {
  // Показати лоадер
  document.getElementById('tBody').innerHTML = `<tr><td colspan="10" style="text-align:center;padding:32px;color:var(--muted);">
    <i class="ti ti-loader" style="font-size:24px;display:block;margin-bottom:8px;animation:spin 1s linear infinite;"></i>
    Завантаження даних...
  </td></tr>`;
  document.getElementById('pag').innerHTML = '';

  const rows = await fetchSheet(catKey);
  if (!rows.length) {
    document.getElementById('tBody').innerHTML = `<tr><td colspan="10" style="text-align:center;padding:32px;color:var(--muted);">Дані не знайдено. Перевірте таблицю.</td></tr>`;
    return;
  }

  // Перший рядок після заголовка — беремо заголовки з першого fetch
  // Заголовки: category, name, col1, col2, col3, price, available
  // Показуємо col1..col3 як колонки таблиці (без category, name, available)
  currentRows = rows;

  // Визначити заголовки колонок з назв у метаданих
  // col1=індекс2, col2=індекс3, col3=індекс4, price=індекс5
  const meta = CAT_META[catKey];

  // Оновити фільтри динамічно з даних
  buildFiltersFromData(rows, meta);
  renderTable();
}

/* Побудувати фільтри з реальних даних таблиці */
function buildFiltersFromData(rows, meta) {
  const fc = meta.filterCol;

  // col1 → може бути diam або shelf або thick
  const col1vals = [...new Set(rows.map(r => r[2]).filter(Boolean))].sort((a,b)=>parseFloat(a)-parseFloat(b));
  const col2vals = [...new Set(rows.map(r => r[3]).filter(Boolean).filter(v=>v!=='—'))].sort();
  const col3vals = [...new Set(rows.map(r => r[4]).filter(Boolean).filter(v=>v!=='—'))].sort();

  // Діаметр
  if ('diam' in fc) { showFilter('fg-diam','ft-diam',col1vals,'diam'); }
  else hideFilter('fg-diam');

  // Полиця
  if ('shelf' in fc) { showFilter('fg-shelf','ft-shelf',col1vals,'shelf'); }
  else hideFilter('fg-shelf');

  // Товщина
  if ('thick' in fc) { showFilter('fg-thick','ft-thick',col1vals,'thick'); }
  else hideFilter('fg-thick');

  // Товщина стінки
  if ('wall' in fc) { showFilter('fg-wall','ft-wall',col2vals,'wall'); }
  else hideFilter('fg-wall');

  // Марка — з col3 або col2 залежно від категорії
  const gradeVals = col3vals.length ? col3vals : col2vals;
  if (gradeVals.length) { showFilter('fg-grade','ft-grade',gradeVals,'grade'); }
  else hideFilter('fg-grade');
}

function showFilter(groupId, containerId, vals, key) {
  const g = document.getElementById(groupId);
  const c = document.getElementById(containerId);
  if (!g || !c) return;
  g.style.display = '';
  c.innerHTML = vals.map(v =>
    `<span class="f-tag${filters[key]===v?' act':''}" onclick="setFilter('${key}','${v.replace(/'/g,"\\'")}')">${v}</span>`
  ).join('');
}

function hideFilter(groupId) {
  const g = document.getElementById(groupId);
  if (g) g.style.display = 'none';
}

/* ============================================================
   РЕНДЕР ФОТО-КАТЕГОРІЙ
   ============================================================ */
function renderPhotoCats() {
  const wrap = document.getElementById('photoCats');
  wrap.innerHTML = Object.entries(CAT_META).map(([k,v]) => `
    <div class="photo-cat${k===activeCat?' active':''}" onclick="selectCatDirect('${k}')">
      <img class="photo-cat-img" src="${v.img}" alt="${v.name}" loading="lazy"
        onerror="this.src='';this.style.background='#1a2a4a';this.style.padding='20px';">
      <div class="photo-cat-body">
        <div class="photo-cat-name">${v.name}</div>
        <div class="photo-cat-cnt">${v.cnt} позицій</div>
      </div>
    </div>`).join('');
  document.getElementById('photoCatsTitle').textContent = CAT_META[activeCat].name;
}

/* ============================================================
   РЕНДЕР ФІЛЬТРІВ (порожній — будується динамічно)
   ============================================================ */
function renderFilters() {}

function renderFilterTags(containerId, groupId, values, filterKey) {
  const cont = document.getElementById(containerId);
  const group = document.getElementById(groupId);
  if (!values.length) { group.style.display = 'none'; return; }
  group.style.display = '';
  cont.innerHTML = values.map(v =>
    `<span class="f-tag${filters[filterKey]===v?' act':''}" onclick="setFilter('${filterKey}','${v.replace(/'/g,"\\'")}')">${v}</span>`
  ).join('');
}

function setFilter(key, val) {
  filters[key] = filters[key] === val ? '' : val;
  page = 1;
  // Оновити вигляд тегів фільтра
  document.querySelectorAll('.f-tag').forEach(t => {
    t.classList.toggle('act', t.textContent === val && filters[key] === val);
  });
  renderTable();
}


function toggleFilter(id) {
  document.getElementById(id).classList.toggle('open');
}

function resetFilters() {
  filters = { diam:'', shelf:'', thick:'', wall:'', grade:'' };
  page = 1;
  renderFilters();
  renderTable();
}

function applyFilters() {
  page = 1;
  renderTable();
}

/* ============================================================
   РЕНДЕР ТАБЛИЦІ (з Google Sheets даних)
   ============================================================ */
function getFiltered() {
  return currentRows.filter(r => {
    // r = [category, name, col1, col2, col3, price, available]
    const col1 = r[2] || '';
    const col2 = r[3] || '';
    const col3 = r[4] || '';
    const all  = [col1,col2,col3].join('|').toLowerCase();
    if (filters.diam  && col1 !== filters.diam)  return false;
    if (filters.shelf && col1 !== filters.shelf)  return false;
    if (filters.thick && col1 !== filters.thick)  return false;
    if (filters.wall  && col2 !== filters.wall)   return false;
    if (filters.grade && !all.includes(filters.grade.toLowerCase())) return false;
    return true;
  });
}

function renderTable() {
  const meta   = CAT_META[activeCat];
  const filtered = getFiltered();
  const thead  = document.getElementById('tHead');
  const tbody  = document.getElementById('tBody');
  const empty  = document.getElementById('emptyState');
  const pagEl  = document.getElementById('pag');

  // Заголовки: беремо з першого рядка даних або ставимо дефолт
  thead.innerHTML = `<tr>
    <th>Параметр 1</th><th>Параметр 2</th><th>Марка / Тип</th>
    <th>Ціна</th><th style="width:120px;"></th>
  </tr>`;

  if (!filtered.length) {
    tbody.innerHTML = '';
    empty.style.display = 'block';
    pagEl.innerHTML = '';
    return;
  }
  empty.style.display = 'none';

  const pages = Math.ceil(filtered.length / PER);
  if (page > pages) page = 1;
  const slice = filtered.slice((page-1)*PER, page*PER);

  tbody.innerHTML = slice.map(r => {
    const col1  = r[2] || '—';
    const col2  = r[3] || '—';
    const col3  = r[4] || '—';
    const price = r[5] || '';
    const name  = r[1] || meta.name;
    const prod  = `${name} ${col1} ${col2} ${col3}`.replace(/'/g,"\\'");
    const priceDisplay = price ? `<span style="color:var(--bronze);font-weight:700;">${price}</span>` : `<span style="color:rgba(255,255,255,0.25);font-size:11px;">уточнюйте</span>`;
    return `<tr>
      <td>${col1}</td>
      <td>${col2}</td>
      <td><span class="td-badge">${col3}</span></td>
      <td>${priceDisplay}</td>
      <td><button class="order-btn" onclick="openModal('${prod}')"><i class="ti ti-shopping-cart"></i>Замовити</button></td>
    </tr>`;
  }).join('');

  // Пагінація
  if (pages <= 1) { pagEl.innerHTML = ''; return; }
  let h = '';
  if (page > 1) h += `<button class="p-btn" onclick="goPage(${page-1})"><i class="ti ti-chevron-left"></i></button>`;
  for (let p = Math.max(1,page-2); p <= Math.min(pages,page+2); p++)
    h += `<button class="p-btn${p===page?' act':''}" onclick="goPage(${p})">${p}</button>`;
  if (page < pages) h += `<button class="p-btn" onclick="goPage(${page+1})"><i class="ti ti-chevron-right"></i></button>`;
  h += `<span class="p-info">${(page-1)*PER+1}–${Math.min(page*PER,filtered.length)} з ${filtered.length}</span>`;
  pagEl.innerHTML = h;
}

function goPage(p) {
  page = p;
  renderTable();
  document.getElementById('shop').scrollIntoView({ behavior:'smooth', block:'start' });
}

/* ============================================================
   НАВІГАЦІЯ
   ============================================================ */
function selectCatDirect(k) {
  activeCat = k;
  filters = { diam:'', shelf:'', thick:'', wall:'', grade:'' };
  page = 1;
  currentRows = [];
  renderPhotoCats();
  loadCategory(k);
}

function selectCat(k, e) {
  e.preventDefault();
  selectCatDirect(k);
  document.getElementById('shop').scrollIntoView({ behavior:'smooth' });
}

/* Анімація спінера */
const style = document.createElement('style');
style.textContent = '@keyframes spin { to { transform: rotate(360deg); } }';
document.head.appendChild(style);


/* ============================================================
   MODAL
   ============================================================ */
function openModal(prod) {
  document.getElementById('mProd').textContent = prod;
  document.getElementById('mProdInput').value  = prod;
  document.getElementById('mFormWrap').style.display = 'block';
  document.getElementById('mOk').style.display = 'none';
  document.getElementById('mForm').reset();
  document.getElementById('mProdInput').value = prod;
  document.getElementById('modalBg').classList.add('open');
}
function closeModal() { document.getElementById('modalBg').classList.remove('open'); }
document.getElementById('modalBg').addEventListener('click', e => { if(e.target===e.currentTarget) closeModal(); });

async function submitModal(e) {
  e.preventDefault();
  const btn = e.target.querySelector('.m-submit');
  btn.style.opacity = '.6'; btn.querySelector('span').textContent = 'Відправляємо...';
  try {
    const res = await fetch('https://formspree.io/f/maewngzz', {
      method:'POST', body:new FormData(e.target), headers:{'Accept':'application/json'}
    });
    if (res.ok) {
      document.getElementById('mFormWrap').style.display = 'none';
      document.getElementById('mOk').style.display = 'block';
      setTimeout(closeModal, 3000);
    } else { btn.querySelector('span').textContent = 'Помилка. Спробуйте ще раз'; btn.style.opacity = '1'; }
  } catch { btn.querySelector('span').textContent = 'Помилка. Спробуйте ще раз'; btn.style.opacity = '1'; }
}

/* СТАРТ */
renderPhotoCats();
loadCategory('pipe');
</script>
</body>
</html>
